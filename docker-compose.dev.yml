services:
  qsmart-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: qsmart-dev
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      NODE_ENV: development
    volumes:
      # Monte le code source pour le hot-reload
      - ./src:/app/src
      - ./static:/app/static
      - ./vite.config.js:/app/vite.config.js
      - ./tailwind.config.js:/app/tailwind.config.js
      # ⚠️ svelte.config.js est patché au build, ne pas le monter
      # Exclure node_modules du host
      - /app/node_modules
    stdin_open: true
    tty: true
